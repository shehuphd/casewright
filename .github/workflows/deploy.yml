name: Build, push, deploy

# Manual-only until Azure exists. Restore the push trigger below once the
# container app is created and AZURE_CREDENTIALS is set, otherwise every
# commit to main mails out a failure for infrastructure nobody built yet.
#
#   on:
#     push:
#       branches: [main]
on:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/shehuphd/casewright

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to GHCR

    env:
      # Deploying needs a service principal that only the repo owner can
      # create. Until that secret exists the build still has to go green:
      # pushing the image to GHCR is useful on its own, and a red tick on
      # every commit trains everyone to ignore the one that matters.
      HAS_AZURE: ${{ secrets.AZURE_CREDENTIALS != '' }}

    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure login
        if: env.HAS_AZURE == 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        if: env.HAS_AZURE == 'true'
        run: |
          az containerapp update \
            --name casewright \
            --resource-group shehu \
            --image ${{ env.IMAGE }}:${{ github.sha }}

      - name: Note that deployment was skipped
        if: env.HAS_AZURE != 'true'
        run: |
          echo "### Image pushed, deployment skipped" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`${IMAGE}:${GITHUB_SHA}\` is in GHCR." >> $GITHUB_STEP_SUMMARY
          echo "Azure deployment needs the \`AZURE_CREDENTIALS\` repository secret, which isn't set." >> $GITHUB_STEP_SUMMARY
